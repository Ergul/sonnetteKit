# Include at nginx.conf TOP LEVEL (outside http{}).
# Requires stream + stream_ssl_preread modules.
# Replace turn.example.com. Test SNI on every target WebRTC runtime.
stream {
    map $ssl_preread_server_name $sonnette_upstream {
        turn.example.com 127.0.0.1:5349;
        default          127.0.0.1:8443;
    }
    server {
        listen 443;
        # Add listen [::]:443 only if IPv6 is deliberately configured.
        ssl_preread on;
        proxy_pass $sonnette_upstream;
        proxy_connect_timeout 5s;
        proxy_timeout 2h;
        proxy_socket_keepalive on;
    }
}
