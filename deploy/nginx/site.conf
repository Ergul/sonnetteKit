# Include INSIDE http{}. Replace names, paths and origin config.
# Move ALL existing HTTPS virtual hosts on this IP from :443 to 127.0.0.1:8443.
# Do not add a second http-level listener on public TCP 443.
map $http_upgrade $sonnette_connection {
    default upgrade;
    '' close;
}
server {
    listen 127.0.0.1:8443 ssl;
    server_name call.example.com;
    ssl_certificate /etc/letsencrypt/live/call.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/call.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    location = /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sonnette_connection;
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
    }
    # Optional: deploy the demo's Flutter Web build here.
    root /var/www/sonnette;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
