# Include this file at Nginx top level, outside the http {} block.
# Nginx terminates TURN TLS and forwards plain TURN/TCP on the private network.
stream {
    server {
        listen 5349 ssl;
        listen [::]:5349 ssl;

        ssl_certificate /etc/letsencrypt/live/turn.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/turn.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # RFC 5737 documentation address: replace with the Docker host address.
        proxy_pass 192.0.2.10:3478;
        proxy_connect_timeout 5s;
        proxy_timeout 2h;
        proxy_socket_keepalive on;
    }
}
