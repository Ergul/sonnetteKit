name: sonnette-single

# Generic single-container deployment. Restrict the published backend ports to
# the reverse-proxy host with firewall rules when Nginx runs on another server.
services:
  server:
    container_name: ${CONTAINER_NAME:-sonnette}
    build:
      context: ../..
      dockerfile: deploy/all-in-one/Dockerfile
    restart: unless-stopped
    env_file: ../../.local/compose.env
    environment:
      TURN_SECRET_FILE: /run/secrets/turn-secret
      DATABASE_PATH: /data/calls.sqlite3
      TURN_RELAY_MIN_PORT: "${TURN_RELAY_MIN_PORT:-49160}"
      TURN_RELAY_MAX_PORT: "${TURN_RELAY_MAX_PORT:-49200}"
    volumes:
      - ../../.local/turn-secret:/run/secrets/turn-secret:ro
      - ../../.local/certs:/certs:ro
      - call-data:/data
    ports:
      - "${SIGNALING_BIND_ADDRESS:-127.0.0.1}:${SIGNALING_PORT:-8000}:8000/tcp"
      # Plain TURN/TCP is private; the external Nginx stream listener adds TLS.
      - "${TURN_BIND_ADDRESS:-127.0.0.1}:${TURN_TCP_PORT:-3478}:3478/tcp"
      # Forward this same public UDP range without port translation.
      - "${TURN_RELAY_BIND_ADDRESS:-0.0.0.0}:${TURN_RELAY_MIN_PORT:-49160}-${TURN_RELAY_MAX_PORT:-49200}:${TURN_RELAY_MIN_PORT:-49160}-${TURN_RELAY_MAX_PORT:-49200}/udp"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    networks:
      sonnette:
        ipv4_address: 172.30.44.10

volumes:
  call-data:

networks:
  sonnette:
    ipam:
      config:
        - subnet: 172.30.44.0/24
