# HTTP-only virtual host used by Certbot's webroot challenge.
# /var/www/certbot contains temporary ACME challenge files, not certificates.
# Certificates remain under /etc/letsencrypt/live/turn.example.com/.
server {
    listen 80;
    listen [::]:80;
    server_name turn.example.com;

    root /var/www/certbot;
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
