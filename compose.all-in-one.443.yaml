# EXPERIMENTAL all-in-one override; needs Docker Compose >=2.24.4.
services:
  server:
    environment:
      ICE_POLICY: relay
      TURN_INTERNAL_ONLY: "1"
      TURN_RELAY_IP: 172.30.44.10
      TURN_EXTERNAL_IP: ""
    ports: !override
      - "${SIGNALING_BIND_ADDRESS:-127.0.0.1}:${SIGNALING_PORT:-8000}:8000/tcp"
      - "${TURN_TLS_BIND_ADDRESS:-127.0.0.1}:${TURN_TLS_PORT:-5349}:5349/tcp"
